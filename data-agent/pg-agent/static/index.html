<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pg-agent</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#21262d;--border:#30363d;
  --accent:#58a6ff;--green:#3fb950;--orange:#d29922;--red:#f85149;
  --purple:#bc8cff;--text:#e6edf3;--muted:#8b949e;--success:#238636;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ─ TOP BAR ─────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.brand{font-weight:700;font-size:16px;letter-spacing:-0.5px}
.brand span{color:var(--accent)}
.db-badge{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.25);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.db-badge::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-tabs{display:flex;gap:2px;margin-left:auto}
.tab{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;border:none;background:transparent;font-family:inherit}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.active{color:var(--accent);background:rgba(88,166,255,.1)}

/* ─ BODY LAYOUT ─────────────────────────────────────────── */
.body{display:flex;flex:1;overflow:hidden}

/* ─ SIDEBAR ─────────────────────────────────────────────── */
.sidebar{width:230px;border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;flex-shrink:0}
.sidebar-section{padding:10px 12px 4px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.table-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:background .12s;font-size:13px;color:var(--muted)}
.table-item:hover{background:var(--panel2);color:var(--text)}
.table-item.active{background:rgba(88,166,255,.08);color:var(--accent);border-left:2px solid var(--accent)}
.table-item .icon{font-size:11px}
.sidebar-loading{padding:16px;color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace}

/* ─ MAIN CONTENT ─────────────────────────────────────────── */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* panels */
.panel{display:none;flex-direction:column;flex:1;overflow:hidden}
.panel.active{display:flex}

/* ─ TABLE EXPLORER ───────────────────────────────────────── */
.explorer-header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;gap:8px}
.explorer-title{font-size:15px;font-weight:700}
.count-badge{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);padding:2px 8px;border-radius:4px}
.filter-row{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.filter-row input, .filter-row select{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 10px;border-radius:6px;outline:none;transition:border-color .2s}
.filter-row input:focus, .filter-row select:focus{border-color:var(--accent)}
.filter-row input::placeholder{color:var(--muted)}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:700}
.btn.primary:hover{opacity:.88}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(248,81,73,.1)}

/* schema strip */
.schema-strip{display:flex;gap:8px;padding:8px 20px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;background:var(--panel)}
.schema-pill{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--panel2);border:1px solid var(--border);padding:3px 8px;border-radius:4px;white-space:nowrap;color:var(--muted)}
.schema-pill .col-name{color:var(--text)}
.schema-pill .col-type{color:var(--purple)}
.schema-pill.pk .col-name{color:var(--orange)}

/* data table */
.table-wrap{flex:1;overflow:auto}
.data-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12px}
.data-table thead th{padding:8px 12px;background:var(--panel2);color:var(--muted);font-size:10px;letter-spacing:.5px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none}
.data-table thead th:hover{color:var(--text)}
.data-table tbody tr{border-bottom:1px solid rgba(48,54,61,.6);transition:background .1s}
.data-table tbody tr:hover{background:rgba(88,166,255,.04)}
.data-table td{padding:7px 12px;color:var(--text);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.null-val{color:var(--muted);font-style:italic}
.num-val{color:var(--purple)}
.bool-val{color:var(--green)}
.date-val{color:var(--orange)}

/* pagination */
.pagination{display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;font-size:12px;color:var(--muted)}
.page-info{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px}

/* ─ SQL EDITOR ───────────────────────────────────────────── */
.sql-layout{display:grid;grid-template-rows:auto 1fr auto;flex:1;overflow:hidden}
.sql-toolbar{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.sql-toolbar select{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:6px 10px;border-radius:6px;outline:none;cursor:pointer}
.sql-editor-wrap{position:relative;border-bottom:1px solid var(--border)}
textarea#sqlEditor{width:100%;background:var(--panel2);border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:16px 20px;resize:none;outline:none;line-height:1.7;min-height:160px}
.line-numbers{position:absolute;left:0;top:0;padding:16px 8px;background:var(--panel);border-right:1px solid var(--border);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;text-align:right;min-width:42px;pointer-events:none}
.sql-results{flex:1;overflow:auto;padding:0}
.sql-error{padding:16px 20px;color:var(--red);font-family:'JetBrains Mono',monospace;font-size:12px;background:rgba(248,81,73,.05);border-bottom:1px solid rgba(248,81,73,.2)}
.sql-meta{padding:8px 20px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;gap:16px;flex-shrink:0}

/* ─ NLQ PANEL ────────────────────────────────────────────── */
.nlq-layout{display:flex;flex-direction:column;flex:1;overflow:hidden;padding:24px}
.nlq-input-row{display:flex;gap:10px;margin-bottom:20px}
.nlq-input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 16px;border-radius:8px;outline:none;transition:border-color .2s}
.nlq-input:focus{border-color:var(--accent)}
.nlq-input::placeholder{color:var(--muted)}
.nlq-result{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px}
.nlq-sql-block{background:var(--panel2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.nlq-sql-header{padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:8px}
.nlq-sql-header .copy-btn{margin-left:auto;cursor:pointer;color:var(--accent);font-size:10px}
.nlq-sql-code{padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);overflow-x:auto;white-space:pre}
.nlq-placeholder{margin:auto;text-align:center;color:var(--muted);max-width:360px}
.nlq-placeholder .icon{font-size:40px;margin-bottom:12px}
.nlq-examples{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.nlq-example{padding:8px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s;color:var(--text)}
.nlq-example:hover{border-color:var(--accent);color:var(--accent)}
.token-row{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-align:right}

/* loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel) 50%,var(--panel2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px;height:14px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">pg<span>-agent</span></div>
  <div class="db-badge" id="dbBadge">connecting…</div>
  <div class="topbar-tabs">
    <button class="tab active" onclick="switchTab('explorer')">🗂 Explorer</button>
    <button class="tab" onclick="switchTab('sql')">⌨ SQL Editor</button>
    <button class="tab" onclick="switchTab('nlq')">🤖 AI Query</button>
  </div>
</div>

<div class="body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">Tables</div>
    <div id="tableList"><div class="sidebar-loading">loading…</div></div>
  </div>

  <div class="content">

    <!-- ── EXPLORER PANEL ─────────────────────────── -->
    <div class="panel active" id="panel-explorer">
      <div class="explorer-header">
        <div class="explorer-title" id="explorerTitle">Select a table</div>
        <div class="count-badge" id="explorerCount" style="display:none"></div>
        <div class="filter-row">
          <input id="filterCol" placeholder="filter column" style="width:130px">
          <input id="filterVal" placeholder="value" style="width:110px">
          <select id="sortCol" title="Sort by"><option value="">sort by…</option></select>
          <select id="sortOrd"><option value="asc">↑ asc</option><option value="desc">↓ desc</option></select>
          <button class="btn" onclick="applyFilter()">Apply</button>
          <button class="btn" onclick="resetFilter()">Reset</button>
        </div>
      </div>
      <div class="schema-strip" id="schemaStrip"></div>
      <div class="table-wrap">
        <div id="explorerTable"><div class="empty-state">← Choose a table from the sidebar</div></div>
      </div>
      <div class="pagination" id="pagination" style="display:none">
        <button class="btn" onclick="changePage(-1)">‹ Prev</button>
        <button class="btn" onclick="changePage(1)">Next ›</button>
        <span class="page-info" id="pageInfo"></span>
      </div>
    </div>

    <!-- ── SQL EDITOR PANEL ───────────────────────── -->
    <div class="panel" id="panel-sql">
      <div class="sql-layout">
        <div class="sql-toolbar">
          <select id="templateSelect" onchange="applyTemplate()">
            <option value="">— insert template —</option>
          </select>
          <button class="btn primary" onclick="runSQL()">▶ Run  <kbd style="opacity:.7;font-size:10px">Ctrl+Enter</kbd></button>
          <button class="btn" onclick="clearSQL()">Clear</button>
          <span style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace">SELECT only · write ops blocked</span>
        </div>
        <div class="sql-editor-wrap">
          <div class="line-numbers" id="lineNumbers">1</div>
          <textarea id="sqlEditor"
            style="padding-left:56px"
            placeholder="SELECT * FROM public.employees LIMIT 100;"
            onkeydown="sqlKeydown(event)"
            oninput="updateLineNumbers()"></textarea>
        </div>
        <div id="sqlResults" class="sql-results"><div class="empty-state">Run a query to see results</div></div>
        <div class="sql-meta" id="sqlMeta" style="display:none"></div>
      </div>
    </div>

    <!-- ── NLQ PANEL ──────────────────────────────── -->
    <div class="panel" id="panel-nlq">
      <div class="nlq-layout">
        <div class="nlq-input-row">
          <input class="nlq-input" id="nlqInput" placeholder="Ask in plain English… e.g. Which employees have leave as NA?"
            onkeydown="if(event.key==='Enter')askNLQ()">
          <button class="btn primary" onclick="askNLQ()">Ask AI</button>
        </div>
        <div class="nlq-result" id="nlqResult">
          <div class="nlq-placeholder">
            <div class="icon">🧠</div>
            <div>Ask anything in plain English.<br>The AI reads your DB schema and writes the SQL for you.</div>
            <div class="nlq-examples" id="nlqExamples"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /body -->

<script>
const API = '';   // same origin — change to http://localhost:8000 for dev

// ── State ─────────────────────────────────────────────────────────────────────
let tables       = [];
let activeTable  = null;
let columns      = [];
let primaryKeys  = [];
let offset       = 0;
const LIMIT      = 50;
let totalRows    = 0;
let filterCol    = '';
let filterVal    = '';
let sortBy       = '';
let sortOrd      = 'asc';

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  await Promise.all([loadTables(), loadTemplates()]);
  loadNLQExamples();
}

async function loadTables() {
  try {
    const res  = await fetch(`${API}/api/tables`);
    const data = await res.json();
    tables = data.tables || [];
    document.getElementById('dbBadge').textContent = `${data.schema} · ${tables.length} tables`;

    const el = document.getElementById('tableList');
    el.innerHTML = tables.map(t => `
      <div class="table-item" id="ti-${t}" onclick="selectTable('${t}')">
        <span class="icon">▤</span>${t}
      </div>`).join('') || '<div class="sidebar-loading">no tables found</div>';
  } catch(e) {
    document.getElementById('dbBadge').textContent = '⚠ not connected';
    document.getElementById('tableList').innerHTML = `<div class="sidebar-loading" style="color:var(--red)">DB error: ${e.message}</div>`;
  }
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  event.target.classList.add('active');
}

// ── Table Explorer ────────────────────────────────────────────────────────────
async function selectTable(name) {
  activeTable = name;
  offset = 0; filterCol=''; filterVal=''; sortBy=''; sortOrd='asc';
  document.getElementById('filterCol').value = '';
  document.getElementById('filterVal').value = '';

  // Sidebar highlight
  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`ti-${name}`).classList.add('active');

  document.getElementById('explorerTitle').textContent = name;

  // Load schema
  const schemaRes = await fetch(`${API}/api/tables/${name}/schema`);
  const schema    = await schemaRes.json();
  columns     = schema.columns || [];
  primaryKeys = schema.primary_keys || [];

  // Sort dropdown
  const sc = document.getElementById('sortCol');
  sc.innerHTML = '<option value="">sort by…</option>' +
    columns.map(c => `<option value="${c.column_name}">${c.column_name}</option>`).join('');

  // Schema strip
  document.getElementById('schemaStrip').innerHTML = columns.map(c => {
    const isPK = primaryKeys.includes(c.column_name);
    return `<div class="schema-pill${isPK?' pk':''}">
      <span class="col-name">${isPK?'🔑 ':''}${c.column_name}</span>
      <span class="col-type">${c.data_type}</span>
      ${c.is_nullable==='YES'?'<span style="color:var(--red);font-size:9px">?</span>':''}
    </div>`;
  }).join('');

  await loadRows();
}

async function loadRows() {
  document.getElementById('explorerTable').innerHTML = '<div class="empty-state"><div class="skeleton" style="width:60%;margin:auto"></div></div>';

  const params = new URLSearchParams({
    limit: LIMIT, offset,
    ...(filterCol && filterVal ? {filter_col: filterCol, filter_val: filterVal} : {}),
    ...(sortBy ? {sort_by: sortBy, sort_order: sortOrd} : {}),
  });

  const res  = await fetch(`${API}/api/tables/${activeTable}?${params}`);
  const data = await res.json();

  if (!res.ok) {
    document.getElementById('explorerTable').innerHTML = `<div class="empty-state" style="color:var(--red)">${data.detail}</div>`;
    return;
  }

  totalRows = data.total;
  const cnt = document.getElementById('explorerCount');
  cnt.style.display = 'block';
  cnt.textContent = `${totalRows.toLocaleString()} rows`;
  document.getElementById('pagination').style.display = 'flex';
  document.getElementById('pageInfo').textContent =
    `${offset+1}–${Math.min(offset+LIMIT, totalRows)} of ${totalRows.toLocaleString()}`;

  renderTable(data.rows, columns.map(c => c.column_name));
}

function renderTable(rows, cols) {
  if (!rows.length) {
    document.getElementById('explorerTable').innerHTML = '<div class="empty-state">No rows found</div>';
    return;
  }
  const keys = cols || Object.keys(rows[0]);
  let h = `<table class="data-table"><thead><tr>`;
  keys.forEach(k => h += `<th onclick="sortByCol('${k}')">${k} ${sortBy===k?(sortOrd==='asc'?'↑':'↓'):''}</th>`);
  h += `</tr></thead><tbody>`;
  rows.forEach(row => {
    h += '<tr>';
    keys.forEach(k => { h += `<td title="${escAttr(String(row[k]??''))}">${renderCell(row[k])}</td>`; });
    h += '</tr>';
  });
  h += '</tbody></table>';
  document.getElementById('explorerTable').innerHTML = h;
}

function escAttr(s) {
  // Escape for HTML attribute contexts inside template strings (title="...").
  return escHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderCell(v) {
  if (v === null || v === undefined || v === '') return '<span class="null-val">NULL</span>';
  if (typeof v === 'boolean') return `<span class="bool-val">${v}</span>`;
  if (typeof v === 'number')  return `<span class="num-val">${v}</span>`;

  const s = String(v);
  const trimmed = s.trim();

  // If the cell already looks like a URL, render it as a clickable anchor.
  // Only allow http(s) URLs to avoid `javascript:` injection.
  let href = null;
  if (/^https?:\/\/\S+$/i.test(trimmed)) {
    href = trimmed;
  } else if (/^www\.\S+$/i.test(trimmed)) {
    href = `https://${trimmed}`;
  }

  if (href) {
    const display = s.length > 60 ? s.slice(0,58)+'…' : s;
    return `<a class="cell-link" href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">${escHtml(display)}</a>`;
  }

  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return `<span class="date-val">${s}</span>`;
  return s.length > 60 ? s.slice(0,58)+'…' : s;
}

function sortByCol(col) {
  if (sortBy === col) sortOrd = sortOrd === 'asc' ? 'desc' : 'asc';
  else { sortBy = col; sortOrd = 'asc'; }
  document.getElementById('sortCol').value = sortBy;
  document.getElementById('sortOrd').value = sortOrd;
  offset = 0; loadRows();
}

function applyFilter() {
  filterCol = document.getElementById('filterCol').value.trim();
  filterVal = document.getElementById('filterVal').value.trim();
  sortBy    = document.getElementById('sortCol').value;
  sortOrd   = document.getElementById('sortOrd').value;
  offset    = 0;
  if (activeTable) loadRows();
}

function resetFilter() {
  filterCol=''; filterVal=''; sortBy=''; sortOrd='asc'; offset=0;
  document.getElementById('filterCol').value='';
  document.getElementById('filterVal').value='';
  document.getElementById('sortCol').value='';
  document.getElementById('sortOrd').value='asc';
  if (activeTable) loadRows();
}

function changePage(dir) {
  const newOffset = offset + dir * LIMIT;
  if (newOffset < 0 || newOffset >= totalRows) return;
  offset = newOffset;
  loadRows();
}

// ── SQL Editor ────────────────────────────────────────────────────────────────
async function loadTemplates() {
  try {
    const res  = await fetch(`${API}/api/sql/templates`);
    const data = await res.json();
    const sel  = document.getElementById('templateSelect');
    (data.templates||[]).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.sql; opt.textContent = t.label;
      sel.appendChild(opt);
    });
  } catch(_) {}
}

function applyTemplate() {
  const sel = document.getElementById('templateSelect');
  if (sel.value) {
    document.getElementById('sqlEditor').value = sel.value;
    updateLineNumbers();
    sel.value = '';
  }
}

async function runSQL() {
  const sql = document.getElementById('sqlEditor').value.trim();
  if (!sql) return;

  document.getElementById('sqlResults').innerHTML = '<div class="empty-state"><div class="skeleton" style="width:50%;margin:auto"></div></div>';
  document.getElementById('sqlMeta').style.display = 'none';
  const t0 = Date.now();

  try {
    const res  = await fetch(`${API}/api/sql/run`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sql})
    });
    const data = await res.json();
    const elapsed = Date.now() - t0;

    if (!res.ok) {
      document.getElementById('sqlResults').innerHTML =
        `<div class="sql-error">⚠ ${data.detail}</div>`;
      return;
    }

    renderTable(data.rows, data.columns);

    const meta = document.getElementById('sqlMeta');
    meta.style.display = 'flex';
    meta.innerHTML = `<span>${data.row_count} rows</span><span>${elapsed}ms</span><span>columns: ${data.columns.join(', ')}</span>`;

  } catch(e) {
    document.getElementById('sqlResults').innerHTML = `<div class="sql-error">⚠ ${e.message}</div>`;
  }
}

function clearSQL() {
  document.getElementById('sqlEditor').value = '';
  document.getElementById('sqlResults').innerHTML = '<div class="empty-state">Run a query to see results</div>';
  document.getElementById('sqlMeta').style.display = 'none';
  updateLineNumbers();
}

function sqlKeydown(e) {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runSQL(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target, s = ta.selectionStart;
    ta.value = ta.value.slice(0,s) + '  ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
  }
}

function updateLineNumbers() {
  const lines = (document.getElementById('sqlEditor').value.match(/\n/g)||[]).length + 1;
  document.getElementById('lineNumbers').textContent = Array.from({length:lines},(_,i)=>i+1).join('\n');
}

// ── NLQ Panel ─────────────────────────────────────────────────────────────────
function loadNLQExamples() {
  const examples = [
    "Which employees have leave status as NA?",
    "Show me the top 5 highest paid employees",
    "How many employees are in each department?",
    "List all products with stock less than 10",
    "Find orders placed in the last 30 days",
  ];
  document.getElementById('nlqExamples').innerHTML = examples.map(e =>
    `<div class="nlq-example" onclick="setNLQ(this.textContent)">${e}</div>`
  ).join('');
}

function setNLQ(text) { document.getElementById('nlqInput').value = text; askNLQ(); }

async function askNLQ() {
  const question = document.getElementById('nlqInput').value.trim();
  if (!question) return;

  const resultEl = document.getElementById('nlqResult');
  resultEl.innerHTML = `<div class="empty-state"><div class="skeleton" style="width:70%;margin:auto;margin-bottom:8px"></div><div class="skeleton" style="width:40%;margin:auto"></div></div>`;

  try {
    const res  = await fetch(`${API}/api/nlq/ask`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question})
    });
    const data = await res.json();

    if (!res.ok) {
      resultEl.innerHTML = `<div class="nlq-placeholder"><div style="color:var(--red)">⚠ ${data.detail}</div></div>`;
      return;
    }

    let html = `
      <div class="nlq-sql-block">
        <div class="nlq-sql-header">
          🤖 Generated SQL
          <span class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('genSQL').textContent)">copy</span>
        </div>
        <div class="nlq-sql-code" id="genSQL">${escHtml(data.generated_sql)}</div>
      </div>
      <div class="token-row">model: ${data.model} · ${data.prompt_tokens} prompt + ${data.reply_tokens} reply tokens</div>`;

    if (data.rows?.length) {
      const cols = data.columns;
      html += `<div style="overflow:auto">
        <table class="data-table">
          <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${data.rows.map(r=>`<tr>${cols.map(c=>`<td>${renderCell(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      <div class="token-row">${data.row_count} rows returned</div>`;
    } else {
      html += `<div class="empty-state">Query returned 0 rows.</div>`;
    }

    resultEl.innerHTML = html;

  } catch(e) {
    resultEl.innerHTML = `<div class="nlq-placeholder"><div style="color:var(--red)">⚠ ${e.message}</div></div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

boot();
</script>
